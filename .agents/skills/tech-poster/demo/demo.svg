<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="920" height="310" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="seq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="seq-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="920" height="310" rx="10" fill="#ffffff"/>

  <!-- 参与者顶盒 -->
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="34" y="20" width="150" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="109" y="45" fill="#0f172a">研发人员 / GitOps</text>

    <rect x="264" y="20" width="156" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="342" y="45" fill="#0f172a">控制面 Console</text>

    <rect x="500" y="20" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
    <text x="575" y="45" fill="#0f172a">Etcd 配置集群</text>

    <rect x="726" y="20" width="160" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="806" y="45" fill="#0f172a">数据面网关节点 ×N</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="109" y1="60" x2="109" y2="286"/>
    <line x1="342" y1="60" x2="342" y2="286"/>
    <line x1="575" y1="60" x2="575" y2="286"/>
    <line x1="806" y1="60" x2="806" y2="286"/>
  </g>

  <!-- 消息 1 -->
  <line x1="109" y1="102" x2="334" y2="102" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#seq-arr)"/>
  <text x="224" y="94" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">1. 提交路由 CRD 变更并审批</text>

  <!-- 消息 2 -->
  <line x1="342" y1="146" x2="567" y2="146" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#seq-arr)"/>
  <text x="456" y="138" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">2. Schema 校验 + 写入新版本号</text>

  <!-- 消息 3 -->
  <line x1="575" y1="194" x2="798" y2="194" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#seq-arr)"/>
  <text x="688" y="186" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">3. Watch 增量广播配置快照</text>

  <!-- 节点内部双缓冲说明 -->
  <rect x="716" y="210" width="180" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="806" y="230" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">双缓冲原子切换路由树（0 中断）</text>

  <!-- 消息 4 -->
  <line x1="806" y1="266" x2="350" y2="266" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#seq-ret)"/>
  <text x="575" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#047857">4. 上报生效版本回执 &amp; 健康状态（平均 &lt; 800ms）</text>
</svg>
