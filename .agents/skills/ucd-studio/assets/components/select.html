<!-- 统一样式选择器：.select-wrap 提供定位，.select-chevron 为自绘箭头；runtime.js 会把真实 select 保留为隐藏的数据/校验层，并叠加自绘触发按钮与浮层选项列表 -->
<label for="example-select"><span>优先级</span><span class="select-wrap"><select id="example-select" name="priority"><option>常规</option><option>高优先级</option><option>紧急</option></select><svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span><span class="field-help">影响列表排序与提醒节奏</span></label>
