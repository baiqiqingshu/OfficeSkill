<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' file:; style-src 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>$title · $product</title><style>:root{$tokens}
$css</style></head>
<body class="$density"><a class="skip" href="#main">跳至主要内容</a><div class="app"><aside class="sidebar"><a class="brand" href="#main"><span class="brand-mark" aria-hidden="true">◈</span>$product</a><nav aria-label="页面区域"><div class="nav-label">Workspace / 工作空间</div><div class="nav-list">$nav</div></nav><div class="sidebar-note"><strong>让每一步工作更清晰</strong>聚焦任务，掌握进度，及时处理需要关注的事项。</div><div class="user"><span class="avatar" aria-hidden="true">林</span><div><strong>林晓</strong><br><small>工作空间成员</small></div></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb">工作空间 /<span>$title</span></div><div class="top-actions"><span class="muted" style="font-size:11px"><i class="status-dot"></i>本地演示</span><button type="button" class="btn btn-small" data-notify="当前为本地原型，数据不会发送至服务器。">帮助与说明</button><span class="avatar" aria-label="当前用户：林晓">林</span></div></header><main id="main" class="main"><div class="page-heading"><div><div class="eyebrow">$eyebrow</div><h1>$title</h1><p>$description</p></div><button type="button" class="btn btn-primary" data-open-dialog><span aria-hidden="true">＋</span>$action</button></div><div class="grid layout-$layout">$blocks</div><p class="footnote">本地交互原型 · 示例数据 · 表单和任务状态不会发送或保存至服务器</p></main></div></div>
<dialog id="create-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">$action</h2><p>填写基本信息，创建一份本地演示草稿。</p><form><div class="stack"><label>事项名称<input name="title" required maxlength="80" placeholder="请输入名称"></label><label>负责人<input name="owner" required placeholder="请输入姓名"></label><label>优先级<select name="priority"><option>常规</option><option>高优先级</option></select></label></div><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button type="submit" class="btn btn-primary">创建草稿</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>$script</body></html>
