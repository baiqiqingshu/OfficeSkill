<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' file:; style-src 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>$title · $product</title><style>:root{$tokens}
$css</style></head>
<body class="$density"><a class="skip" href="#main">跳至主要内容</a><div class="app"><aside class="sidebar"><a class="brand" href="#main"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5h6v6H5z M14 5h5v6h-5z M5 14h6v5H5z M14 14h5v5h-5z" fill="currentColor"/></svg></span><span>$product</span></a><div class="workspace-label">企业工作空间</div><nav aria-label="页面区域"><div class="nav-label">本页导航</div><div class="nav-list">$nav</div></nav><div class="sidebar-bottom"><div class="sidebar-caption">内部业务工具</div><div class="user"><span class="avatar" aria-hidden="true">林</span><div><strong>林晓</strong><small>示例成员 · 研发部</small></div></div></div></aside><div class="workspace"><header class="topbar"><nav class="breadcrumb" aria-label="当前位置">$product<span aria-hidden="true">/</span><strong aria-current="page">$title</strong></nav><div class="top-actions"><span class="environment">示例环境</span><button type="button" class="help-button" data-notify="此页面使用本地示例数据。搜索、筛选、表单校验和状态切换可直接体验；刷新后恢复初始状态。">使用说明</button></div></header><main id="main" class="main" tabindex="-1"><div class="page-heading"><div><h1>$title</h1><p>$description</p></div><button type="button" class="btn btn-primary" data-open-dialog><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg>$action</button></div><div class="grid layout-$layout">$blocks</div><p class="footnote">示例数据 · 操作仅在当前页面生效，刷新后恢复</p></main></div></div>
<dialog id="create-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><h2 id="dialog-title">$action</h2><p id="dialog-description">填写基本信息，创建一份本地演示草稿。事项名称和负责人为必填项。</p><form><div class="stack"><label>事项名称<span class="visually-hidden">（必填）</span><input name="title" required maxlength="80" placeholder="请输入名称"></label><label>负责人<span class="visually-hidden">（必填）</span><input name="owner" required placeholder="请输入姓名"></label><label>优先级<span class="select-wrap"><select name="priority"><option>常规</option><option>高优先级</option></select><svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></label></div><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button type="submit" class="btn btn-primary">创建草稿</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>$script</body></html>
