<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' file:; style-src 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>$title · $product</title><style>:root{$tokens}
$css</style></head>
<body class="$density $shell_class"><a class="skip" href="#main">跳至主要内容</a><div class="app"><aside class="sidebar"><a class="brand" href="#main"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="10.5" height="16" rx="2.4"/><rect x="16.5" y="4" width="3.5" height="7.5" rx="1.7"/><rect x="16.5" y="13.5" width="3.5" height="6.5" rx="1.7"/></svg></span><span>$product</span></a><div class="workspace-label">$workspace_label</div><nav aria-label="页面区域"><div class="nav-label">页面导航</div><div class="nav-list">$nav</div></nav><div class="sidebar-bottom"><div class="user"><span class="avatar" aria-hidden="true">$user_avatar</span><div><strong>$user_name</strong><small>$user_role</small></div></div><div class="sidebar-caption">离线原型 · 本地演示</div></div></aside><div class="workspace"><header class="topbar"><nav class="breadcrumb" aria-label="当前位置">$product<svg class="crumb-sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><strong aria-current="page">$title</strong></nav><div class="top-actions"><span class="environment"><i class="status-dot" aria-hidden="true"></i>本地原型</span><button type="button" class="help-button" data-notify="此页面使用本地示例数据。搜索、筛选、详情抽屉、表单校验与状态切换均可直接体验；刷新后恢复初始状态。"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 1 1 3.7 2.5c-.8.35-1.1.9-1.1 1.8"/><path d="M12 16.8h.01"/></svg>使用说明</button></div></header><main id="main" class="main" tabindex="-1"><div class="page-heading"><div><h1>$title</h1><p>$description</p></div><div class="heading-actions">$extra_actions<button type="button" class="btn btn-primary" data-open-dialog aria-haspopup="dialog" aria-controls="create-dialog"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg>$action</button></div></div><div class="grid layout-$layout">$blocks</div><p class="footnote">本地离线演示数据 · 所有交互仅在当前页面生效，刷新恢复初始状态</p></main></div></div>
<dialog id="create-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><h2 id="dialog-title">$action</h2><p id="dialog-description">填写基本信息即可创建一份本地演示草稿，事项名称与负责人为必填项。</p><form><div class="stack"><label>事项名称<span class="visually-hidden">（必填）</span><input type="text" name="title" required maxlength="80" placeholder="请输入名称" autocomplete="off"></label><label>负责人<span class="visually-hidden">（必填）</span><input type="text" name="owner" required maxlength="40" placeholder="请输入姓名" autocomplete="off"></label><label>优先级<span class="select-wrap"><select name="priority"><option>常规</option><option>高优先级</option><option>紧急</option></select><svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></label></div><div class="dialog-actions"><button type="button" class="btn" data-close-dialog>取消</button><button type="submit" class="btn btn-primary">创建草稿</button></div></form></dialog>
<div id="drawer-backdrop" class="drawer-backdrop" hidden></div><aside id="detail-drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden><div class="drawer-head"><h2 id="drawer-title">记录详情</h2><button type="button" class="btn btn-small" data-drawer-close aria-label="关闭详情">关闭</button></div><div class="drawer-body"><dl class="drawer-kv" data-drawer-kv></dl></div><div class="drawer-foot"><button type="button" class="btn" data-drawer-action="已退回">退回</button><button type="button" class="btn btn-primary" data-drawer-action="已通过">审批通过</button></div></aside>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>$script</body></html>
