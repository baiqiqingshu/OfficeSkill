<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>协同管理平台</title><style>:root{--primary:#1f4fd8;--primary-ink:#ffffff;--soft:#e7eefc;--bg:#f4f6f9;--surface:#ffffff;--ink:#101c2c;--muted:#55637a;--border:#e3e8f0;--radius:14px;--surface-2:#edf1f7;--line-strong:#c2cddf;--shadow:0 1px 2px rgb(16 28 44/.04),0 16px 40px -16px rgb(16 28 44/.12);--shadow-pop:0 4px 14px -4px rgb(16 28 44/.10),0 28px 56px -18px rgb(16 28 44/.20);--ring:rgb(31 79 216/.26);--scheme:light;--success:#17724f;--success-soft:#e7f3ec;--warning:#8a5a10;--warning-soft:#f7eeda;--danger:#b03846;--danger-soft:#fae9eb}
/* UCD Studio Workspace Design System — Porcelain Sapphire (r4) */
:root {
  --control-radius: 10px;
  --r-pill: 999px;
  --motion: 180ms cubic-bezier(.3, .7, .3, 1);
  color-scheme: var(--scheme, light);
}
* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--muted), transparent 55%) transparent;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--muted), transparent 60%);
  border: 3px solid transparent;
  border-radius: var(--r-pill);
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
  background: color-mix(in srgb, var(--muted), transparent 35%);
  background-clip: content-box;
}
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.6 "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button, a, input, select, textarea, summary { outline-offset: 2px; }
:focus-visible { outline: 2px solid var(--primary); box-shadow: 0 0 0 4px var(--ring); }
button { cursor: pointer; }
button:disabled {
  cursor: not-allowed;
  color: var(--muted);
  background: var(--surface-2);
  border-color: var(--border);
  box-shadow: none;
  opacity: .72;
}
::selection { background: color-mix(in srgb, var(--primary), transparent 86%); color: var(--ink); }
input, textarea { caret-color: var(--primary); }
[hidden] { display: none !important; }
h1, h2, h3, p, figure { margin: 0; }
h1 { font-size: 21px; font-weight: 650; line-height: 1.35; letter-spacing: -.015em; overflow-wrap: anywhere; }
h2 { font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
h3 { font-size: 13.5px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
small, .muted { color: var(--muted); }
small { font-size: 12px; }
svg { display: block; }
.icon { width: 16px; height: 16px; flex-shrink: 0; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
.skip {
  position: fixed; z-index: 100; top: -80px; left: 20px; padding: 10px 16px;
  background: var(--surface); color: var(--primary); font-weight: 600;
  border: 1px solid var(--primary); border-radius: var(--control-radius); box-shadow: var(--shadow-pop);
}
.skip:focus { top: 12px; }

/* Shell */
.project-app { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0, 1fr); }
.project-sidebar {
  position: sticky; top: 0; height: 100vh; overflow: auto;
  padding: 18px 12px 16px;
  background: var(--surface-2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 14px;
}
.project-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 6px; font-size: 15px; font-weight: 650; min-width: 0;
}
.project-brand strong { min-width: 0; overflow-wrap: anywhere; }
.brand-mark {
  display: grid; place-items: center; flex-shrink: 0;
  width: 32px; height: 32px; border-radius: 10px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--primary), #fff 24%), color-mix(in srgb, var(--primary), var(--ink) 12%));
  color: var(--primary-ink);
  box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--primary), transparent 48%);
  transition: box-shadow var(--motion);
}
.brand-mark .icon { width: 18px; height: 18px; }
.project-brand:hover .brand-mark { box-shadow: 0 5px 14px -3px color-mix(in srgb, var(--primary), transparent 36%); }
.workspace-label {
  display: flex; align-items: center; gap: 8px;
  margin: 0 4px; padding: 6px 12px;
  font-size: 12px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-pill);
}
.workspace-label::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--success); flex-shrink: 0;
}
.nav-group { display: grid; gap: 3px; }
.nav-group + .nav-group { margin-top: 10px; }
.nav-group-label {
  font-size: 11px; letter-spacing: .04em; color: var(--muted);
  margin: 0 12px 4px; font-weight: 600;
}
.project-sidebar nav { display: grid; gap: 3px; }
.project-sidebar nav button {
  width: 100%; display: flex; align-items: center; gap: 10px;
  border: 0; border-radius: var(--r-pill); background: transparent;
  padding: 8px 13px; text-align: left; color: var(--muted); font-size: 13px;
  transition: background-color var(--motion), color var(--motion), box-shadow var(--motion);
}
.project-sidebar nav button:hover {
  background: color-mix(in srgb, var(--ink), transparent 94%);
  color: var(--ink);
}
.project-sidebar nav button.active {
  background: var(--surface); color: var(--ink); font-weight: 600;
  box-shadow: 0 1px 2px color-mix(in srgb, var(--ink), transparent 92%),
              0 4px 12px -4px color-mix(in srgb, var(--ink), transparent 90%);
}
.project-sidebar nav button.active .nav-svg { color: var(--primary); }
.nav-svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted); transition: color var(--motion); }
.nav-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-badge {
  font-size: 11px; padding: 1px 7px; border-radius: var(--r-pill);
  background: var(--soft); color: var(--primary); font-weight: 600;
}
.sidebar-user {
  display: flex; align-items: center; gap: 10px;
  margin-top: auto;
  background: var(--surface);
  border: 1px solid color-mix(in srgb, var(--border), transparent 20%);
  border-radius: var(--radius);
  padding: 10px 12px;
  box-shadow: var(--shadow);
  font-size: 13px;
}
.sidebar-user strong, .sidebar-user small { display: block; line-height: 1.35; }
.user-avatar {
  display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0;
  background: var(--soft); border-radius: 50%; color: var(--primary); font-weight: 600; font-size: 13px;
}
.project-workspace { min-width: 0; display: flex; flex-direction: column; }
.project-topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 52px; padding: 0 28px;
  background: color-mix(in srgb, var(--bg), transparent 22%);
  backdrop-filter: blur(14px) saturate(1.45);
  -webkit-backdrop-filter: blur(14px) saturate(1.45);
  color: var(--muted); font-size: 13px;
}
.project-topbar::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--primary), transparent 18%), color-mix(in srgb, var(--primary), transparent 62%) 38%, color-mix(in srgb, var(--primary), transparent 94%));
  pointer-events: none;
}
.topbar-breadcrumb { display: flex; align-items: center; gap: 8px; min-width: 0; }
.topbar-breadcrumb strong { color: var(--ink); font-weight: 600; }
.breadcrumb-sep { width: 13px; height: 13px; color: var(--muted); opacity: .7; flex-shrink: 0; }
.local-indicator {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  padding: 4px 12px; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--ink), transparent 93%);
  font-size: 12px; color: var(--muted);
}
.local-indicator i { width: 6px; height: 6px; background: var(--success); border-radius: 50%; }
main { width: 100%; max-width: 1440px; padding: 24px 28px 32px; margin: 0 auto; }
.page-heading {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
}
.eyebrow { color: var(--primary); font-size: 11.5px; font-weight: 600; margin-bottom: 4px; letter-spacing: .04em; }
#ucd-page-description { margin-top: 5px; color: var(--muted); font-size: 13px; max-width: 72ch; }
#ucd-page-description:empty { display: none; }
#ucd-content { display: grid; gap: 18px; min-width: 0; }
.ucd-node, .ucd-child { min-width: 0; }
.page-footnote { margin-top: 24px; color: var(--muted); font-size: 12px; }

/* Panels */
.panel {
  position: relative;
  background: var(--surface);
  border: 1px solid color-mix(in srgb, var(--border), transparent 22%);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 15px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.panel-head p { color: var(--muted); font-size: 12px; margin-top: 3px; }
.panel-body { padding: 18px 20px; }
.comfortable .panel-head { padding: 18px 24px; }
.comfortable .panel-body { padding: 22px 24px; }

/* Buttons */
.toolbar-actions, .selection-bar, .pagination { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; justify-content: center; align-items: center; gap: 6px;
  min-height: 34px; padding: 6px 14px;
  border: 1px solid var(--border); border-radius: var(--control-radius);
  background: var(--surface); color: var(--ink);
  font-size: 13px; font-weight: 500; line-height: 1.45; white-space: nowrap;
  box-shadow: 0 1px 2px color-mix(in srgb, var(--ink), transparent 95%);
  transition: background-color var(--motion), border-color var(--motion), color var(--motion), box-shadow var(--motion), transform var(--motion);
}
.btn:hover:not(:disabled) {
  background: color-mix(in srgb, var(--ink), transparent 96%);
  border-color: var(--line-strong);
}
.btn:active:not(:disabled) { background: var(--soft); border-color: var(--line-strong); }
.btn-primary {
  background: var(--primary); border-color: var(--primary); color: var(--primary-ink);
  box-shadow: 0 1px 2px color-mix(in srgb, var(--primary), transparent 72%);
}
.btn-primary:hover:not(:disabled) {
  background: color-mix(in srgb, var(--primary), var(--ink) 12%);
  border-color: color-mix(in srgb, var(--primary), var(--ink) 12%);
  transform: translateY(-1px);
  box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--primary), transparent 44%);
}
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-danger {
  background: var(--danger); border-color: var(--danger); color: #ffffff;
  box-shadow: 0 1px 2px color-mix(in srgb, var(--danger), transparent 72%);
}
.btn-danger:hover:not(:disabled) {
  background: color-mix(in srgb, var(--danger), var(--ink) 14%);
  border-color: color-mix(in srgb, var(--danger), var(--ink) 14%);
}
.btn-small { min-height: 30px; padding: 4px 11px; font-size: 12px; }
.btn-link {
  display: inline-flex; align-items: center; gap: 4px;
  background: transparent; border: 0; border-radius: 6px;
  padding: 4px 8px; color: var(--primary); font-size: 12.5px; font-weight: 500; white-space: nowrap;
  transition: background-color var(--motion), color var(--motion);
}
.btn-link:hover { background: var(--soft); }
.btn-link.danger { color: var(--danger); }
.btn-link.danger:hover { background: var(--danger-soft); }
.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  border: 1px solid transparent; border-radius: var(--control-radius);
  background: transparent; color: var(--muted); padding: 5px 10px; font-size: 12.5px;
  transition: background-color var(--motion), color var(--motion);
}
.btn-ghost:hover { background: color-mix(in srgb, var(--ink), transparent 94%); color: var(--ink); }
.btn .icon { width: 15px; height: 15px; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 16px; }
.stat-card {
  position: relative;
  background: var(--surface);
  border: 1px solid color-mix(in srgb, var(--border), transparent 22%);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 20px;
  display: flex; flex-direction: column; min-width: 0;
  transition: transform var(--motion), box-shadow var(--motion), border-color var(--motion);
}
.stat-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-pop); }
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { border-color: color-mix(in srgb, var(--primary), transparent 55%); }
.stat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat-label { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.stat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); opacity: .78; flex-shrink: 0; }
.stat-card.warning .stat-dot { background: var(--warning); }
.stat-card.success .stat-dot { background: var(--success); }
.stat-card.danger .stat-dot { background: var(--danger); }
.stat-icon-box {
  width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--soft); color: var(--primary); flex-shrink: 0;
}
.stat-card.warning .stat-icon-box { background: var(--warning-soft); color: var(--warning); }
.stat-card.success .stat-icon-box { background: var(--success-soft); color: var(--success); }
.stat-card.danger .stat-icon-box { background: var(--danger-soft); color: var(--danger); }
.stat-card strong {
  font-size: 28px; line-height: 1.25; margin: 8px 0 6px;
  font-weight: 650; letter-spacing: -.02em; overflow-wrap: anywhere;
}
.stat-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.stat-change {
  display: inline-flex; align-items: center; padding: 1px 8px;
  border-radius: var(--r-pill); font-size: 11.5px; font-weight: 600;
  background: var(--soft); color: var(--primary);
}
.stat-change.up { background: var(--success-soft); color: var(--success); }
.stat-change.down { background: var(--danger-soft); color: var(--danger); }

/* Fields & Controls */
.filter-bar {
  display: flex; align-items: flex-end; gap: 12px;
  padding: 14px 20px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.filter-bar > .ucd-child { flex: 0 1 180px; min-width: 145px; }
.filter-bar > .ucd-child:has(input[type=search]) { flex: 1 1 210px; max-width: 300px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; min-width: 0; }
.field > span { font-weight: 500; color: var(--muted); }
input:not([type=checkbox]):not([type=radio]), select, textarea {
  width: 100%; min-width: 0; min-height: 34px;
  border: 1px solid var(--border); border-radius: var(--control-radius);
  padding: 6px 12px; background: var(--surface); color: var(--ink);
  font-size: 13px; line-height: 1.5;
  transition: border-color var(--motion), box-shadow var(--motion);
}
input:not([type=checkbox]):not([type=radio]):hover:not(:disabled),
select:hover:not(:disabled),
textarea:hover:not(:disabled) { border-color: var(--line-strong); }
input:not([type=checkbox]):not([type=radio]):focus,
select:focus,
textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); outline: none; }
input:disabled, select:disabled, textarea:disabled {
  background: var(--surface-2); color: var(--muted); cursor: not-allowed; border-color: var(--border);
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .78; }
input:user-invalid, select:user-invalid, textarea:user-invalid { border-color: var(--danger); }
textarea { min-height: 96px; resize: vertical; }
input[type=checkbox]:not([role=switch]) {
  width: 15px; height: 15px; margin: 0; accent-color: var(--primary);
  vertical-align: middle; cursor: pointer;
}
input[type=radio] { accent-color: var(--primary); cursor: pointer; }
.required { color: var(--danger); margin-left: 2px; }
.field-checkbox { flex-direction: row; align-items: center; gap: 9px; padding-top: 22px; }
.field-checkbox > span { color: var(--ink); font-size: 13px; }
.field-switch { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--control-radius); background: var(--surface); min-height: 40px; }
.field-switch > span { color: var(--ink); font-size: 13px; }
input[type=checkbox][role=switch] {
  appearance: none; -webkit-appearance: none;
  width: 38px; min-width: 38px; height: 22px; min-height: 22px;
  padding: 0; border: 0; border-radius: var(--r-pill);
  background: var(--line-strong); position: relative; cursor: pointer; flex-shrink: 0;
  transition: background-color var(--motion);
}
input[type=checkbox][role=switch]::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgb(0 0 0 / .22), 0 1px 4px rgb(0 0 0 / .12);
  transition: transform var(--motion);
}
input[type=checkbox][role=switch]:checked { background: var(--primary); }
input[type=checkbox][role=switch]:checked::after { transform: translateX(16px); }
input[type=checkbox][role=switch]:disabled { opacity: .5; cursor: not-allowed; }
.input-wrap { position: relative; display: block; }
.input-wrap .input-icon {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--muted); pointer-events: none;
  transition: color var(--motion);
}
.input-wrap input:not([type=checkbox]):not([type=radio]) { padding-left: 34px; }
.input-wrap:focus-within .input-icon { color: var(--primary); }
.radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border: 1px solid var(--border); border-radius: var(--r-pill);
  font-size: 12.5px; cursor: pointer; background: var(--surface);
  transition: border-color var(--motion), background-color var(--motion), color var(--motion);
}
.radio-pill:has(input:checked) { border-color: var(--primary); background: var(--soft); color: var(--primary); font-weight: 500; }
.radio-pill input { width: 13px; height: 13px; margin: 0; }
.tags-group { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px; border: 1px solid var(--border); border-radius: var(--r-pill);
  font-size: 12px; cursor: pointer; background: var(--surface); color: var(--muted);
  transition: border-color var(--motion), background-color var(--motion), color var(--motion);
}
.tag-chip:has(input:checked) { border-color: var(--primary); background: var(--soft); color: var(--primary); font-weight: 500; }
.tag-chip input { position: absolute; opacity: 0; pointer-events: none; }

/* Custom Enhanced Select */
.select-wrap { position: relative; display: block; }
.select-wrap select { appearance: none; -webkit-appearance: none; padding-right: 32px; }
.select-chevron {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--muted); pointer-events: none;
  transition: color var(--motion), transform var(--motion);
}
.select-wrap:hover .select-chevron { color: var(--ink); }
.select-wrap select:disabled ~ .select-chevron { opacity: .4; }
select[data-select-enhanced] {
  position: absolute; inset: 0; width: 100%; height: 100%;
  min-height: 0; padding: 0; border: 0; opacity: 0; pointer-events: none;
}
.select-trigger {
  display: block; width: 100%; min-width: 0; min-height: 34px;
  padding: 6px 32px 6px 12px;
  border: 1px solid var(--border); border-radius: var(--control-radius);
  background: var(--surface); color: var(--ink);
  font-size: 13px; line-height: 1.5; text-align: left; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: border-color var(--motion), box-shadow var(--motion);
}
.select-trigger:hover:not(:disabled) { border-color: var(--line-strong); }
.select-trigger:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); outline: none; }
.select-trigger:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; border-color: var(--border); }
.select-trigger[aria-expanded=true] { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
.select-wrap:has(.select-trigger[aria-expanded=true]) .select-chevron { color: var(--primary); transform: translateY(-50%) rotate(180deg); }
.select-value { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.select-pop {
  position: fixed; z-index: 80; max-height: 256px; min-width: 130px; overflow: auto;
  padding: 4px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--control-radius); box-shadow: var(--shadow-pop);
  font-size: 13px; color: var(--ink); animation: select-pop-in .12s ease-out;
}
@keyframes select-pop-in { from { opacity: 0; transform: translateY(-3px); } }
.select-opt {
  position: relative; display: flex; align-items: center;
  min-height: 32px; padding: 5px 30px 5px 10px; border-radius: 7px;
  cursor: pointer; user-select: none; white-space: nowrap;
}
.select-opt:hover, .select-opt[data-active] { background: color-mix(in srgb, var(--ink), transparent 94%); }
.select-opt[aria-selected=true] { background: var(--soft); color: var(--primary); font-weight: 600; }
.select-opt[aria-disabled=true] { color: var(--muted); cursor: not-allowed; }
.select-opt-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    toastTimer = setTimeout(() => toast.hidden = true, 3200);
  }

  function stateKeyFor(targetId) { return `${currentPage}:${targetId}`; }
  function setFilter(targetId, patch, reset = false) {
    const key = stateKeyFor(targetId);
    if (!states.has(key)) states.set(key, {});
    const targetState = states.get(key);
    targetState.filters = reset ? {...patch} : {...(targetState.filters || {}), ...patch};
    targetState.page = 0;
    renderPage();
  }
  function getFilter(targetId) { return states.get(stateKeyFor(targetId))?.filters || {}; }

  function mount(node, root, path, extra = {}) {
    if (!node || !definitions.has(node.component)) throw new Error(`未注册组件：${node?.component}`);
    dispose(root);
    const definition = definitions.get(node.component), pending = [];
    const id = `${currentPage}:${node.id || path}${extra.row ? `:row:${String(extra.row[extra.rowKey || 'id'] ?? path)}` : ''}`;
    if (!states.has(id)) states.set(id, {});
    if (!pageStates.has(currentPage)) pageStates.set(currentPage, {});
    const props = node.props || {};
    const child = (value, scope = {}) => {
      const index = pending.push({value, scope}) - 1;
      return `<div class="ucd-child" data-ucd-child="${index}"></div>`;
    };
    const ctx = {
      ...extra, root, app: model.app, node, id, state: states.get(id),
      pageState: pageStates.get(currentPage),
      setPageState: (k, v) => { pageStates.get(currentPage)[k] = v; renderPage(); },
      setFilter, getFilter, icon, confirm: confirmDialog,
      escape, q, qa, notify, normalizeAction,
      data: name => model.data[name] || [],
      asset: name => model.assets[name] || '',
      child: (component, values = {}, scope = {}) => child({component, props: values}, scope),
      slot: (name = 'default', scope = {}) => node.slots?.[name] ? child(node.slots[name], scope) : '',
      refresh: () => mount(node, root, path, extra),
      action: (value, scope = {}) => action(value, {...extra, ...scope, node, props}),
      setData: (name, rows) => {
        if (!(name in model.data)) throw new Error(`数据集不存在：${name}`);
        model.data[name] = rows;
        renderPage();
      },
      open: (value, options = {}) => open(value, options),
      close: closeOverlay,
      navigate,
      value: (field, value) => {
        if (Array.isArray(value)) {
          return value.length ? value.map(v => `<span class="badge primary">${escape(v)}</span>`).join(' ') : '—';
        }
        const option = field.options?.find(item => typeof item === 'object' && String(item.value) === String(value));
        const label = option ? option.label : value;
        if (field.tones?.[value]) return `<span class="badge ${escape(field.tones[value])}">${escape(label)}</span>`;
        if (field.type === 'checkbox' || field.type === 'switch') return value ? '<span class="badge success">已开启</span>' : '<span class="badge neutral">未开启</span>';
        return escape(value === '' || value == null ? '—' : label);
      }
    };
    root.className = `ucd-node node-${node.component}`;
    root.innerHTML = definition.render(props, ctx) || '';
    const placeholders = qa('[data-ucd-child]', root);
    for (const [index, item] of pending.entries()) {
      const target = placeholders[index];
      if (!target) continue;
      const children = Array.isArray(item.value) ? item.value : [item.value];
      for (const [position, value] of children.entries()) {
        const element = document.createElement('div');
        target.append(element);
        mount(value, element, `${path}/${index}/${position}`, {...extra, ...item.scope});
      }
    }
    enhanceSelects(root);
    const cleanup = definition.mount?.(root, props, ctx);
    cleanups.set(root, cleanup);
    return ctx;
  }

  function closeOverlay() {
    closeDropdown(false);
    const dialog = q('#ucd-overlay');
    if (dialog.open) dialog.close();
  }
  function open(node, options = {}) {
    closeOverlay();
    const dialog = q('#ucd-overlay'), body = q('#ucd-overlay-body');
    overlayReturn = document.activeElement;
    dialog.className = options.mode === 'dialog' ? 'modal' : 'drawer';
    q('#ucd-overlay-title').textContent = options.title || node.props?.title || '详情';
    dialog.setAttribute('aria-labelledby', 'ucd-overlay-title');
    mount(node, body, 'overlay', options.context || {});
    dialog.showModal();
    (q('input:not([type=hidden]),.select-trigger,select,textarea', body) || q('[data-overlay-close]')).focus();
  }

  async function action(value, env = {}) {
    const act = normalizeAction(value), props = env.props || {}, dataName = act.data || props.data;
    const rowKey = props.rowKey || 'id', rows = model.data[dataName] || [];
    const selected = env.rows || (env.row ? [env.row] : []);
    if (act.type === 'navigate') return navigate(act.page);
    if (act.type === 'toast') return notify(act.message || act.label);
    if (act.type === 'filter') {
      if (!act.target) return;
      const patch = act.values || (act.field ? {[act.field]: act.value ?? ''} : {});
      return setFilter(act.target, patch, Boolean(act.reset));
    }
    if (act.type === 'open') {
      const node = model.pages[currentPage].views?.[act.target];
      if (!node) throw new Error(`找不到视图：${act.target}`);
      return open(node, {title: act.label, mode: act.mode, context: {row: env.row}});
    }
    if (!dataName || !(dataName in model.data)) return notify('请为此操作配置数据集');
    if (act.type === 'create' || act.type === 'edit') {
      const original = act.type === 'edit' ? env.row : null;
      if (act.type === 'edit' && !original) return;
      const fields = props.formFields || props.fields || [];
      const node = {component: 'form', props: {fields, record: original || {}, submitLabel: '保存'}, slots: {after: env.node?.slots?.form || []}};
      return open(node, {
        title: act.type === 'create' ? act.label : `编辑${props.title || '记录'}`,
        mode: act.mode,
        context: {
          row: original, rowKey,
          onSubmit: values => {
            const record = {...original, ...values};
            if (!original) record[rowKey] = globalThis.crypto?.randomUUID?.() || `record-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            model.data[dataName] = original
              ? model.data[dataName].map(row => row[rowKey] === original[rowKey] ? record : row)
              : [record, ...model.data[dataName]];
            closeOverlay();
            renderPage();
            notify('已保存');
          }
        }
      });
    }
    if (act.type === 'detail') {
      return open(
        {component: 'detail', props: {fields: props.fields || [], record: env.row || {}}, slots: {after: env.node?.slots?.detail || []}},
        {title: env.row?.[props.titleField || 'title'] || '记录详情', mode: act.mode, context: {row: env.row, rowKey}}
      );
    }
    if (!selected.length) return notify('请先选择记录');
    const ids = new Set(selected.map(row => row[rowKey]));
    if (act.type === 'delete') {
      const ok = await confirmDialog(act.confirm || `确认删除选中的 ${selected.length} 条记录？此操作仅影响当前演示数据。`, {title: '删除确认', confirmLabel: '确认删除', danger: true});
      if (!ok) return;
      model.data[dataName] = rows.filter(row => !ids.has(row[rowKey]));
    } else if (act.type === 'update' || act.type === 'approve') {
      if (act.confirm) {
        const ok = await confirmDialog(act.confirm, {title: act.label || '操作确认', confirmLabel: '确认'});
        if (!ok) return;
      }
      const values = act.values || {[props.statusField || 'status']: '已通过'};
      model.data[dataName] = rows.map(row => ids.has(row[rowKey]) ? {...row, ...values} : row);
    } else {
      return notify(`尚未实现的操作：${act.type}`);
    }
    renderPage();
    notify(act.message || '已更新记录');
  }

  function renderPage() {
    const page = model.pages[currentPage], root = q('#ucd-content');
    dispose(root);
    root.innerHTML = '';
    const eyebrow = q('#ucd-page-eyebrow');
    if (eyebrow) { eyebrow.textContent = page.eyebrow || ''; eyebrow.hidden = !page.eyebrow; }
    q('#ucd-page-title').textContent = page.title;
    q('#ucd-page-description').textContent = page.description || '';
    q('#ucd-breadcrumb').textContent = page.title;
    qa('[data-page]').forEach(button => {
      const active = button.dataset.page === currentPage;
      button.classList.toggle('active', active);
      if (active) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    try {
      page.content.forEach((node, i) => {
        const element = document.createElement('div');
        root.append(element);
        mount(node, element, `content/${i}`);
      });
    } catch (error) {
      const message = document.createElement('div');
      message.className = 'alert danger';
      message.textContent = `页面配置错误：${error.message}`;
      root.append(message);
      throw error;
    }
  }

  function navigate(id) {
    if (!(id in model.pages)) return notify('目标页面不存在');
    closeOverlay();
    currentPage = id;
    if (location.hash !== `#/${id}`) location.hash = `/${id}`;
    renderPage();
  }

  function buildNavHtml() {
    const entries = Object.entries(model.pages);
    const defaultIcons = ['table', 'dashboard', 'users', 'form', 'settings', 'chart', 'layers'];
    const groups = [];
    const byGroup = new Map();
    entries.forEach(([id, page], idx) => {
      const groupName = page.group || '';
      if (!byGroup.has(groupName)) {
        const list = [];
        byGroup.set(groupName, list);
        groups.push([groupName, list]);
      }
      byGroup.get(groupName).push({
        id,
        title: page.title,
        icon: page.icon || defaultIcons[idx % defaultIcons.length],
        badge: page.badge
      });
    });
    const showGroupLabels = groups.some(([name]) => Boolean(name));
    return groups.map(([groupName, items]) => {
      const label = showGroupLabels && groupName ? `<p class="nav-group-label">${escape(groupName)}</p>` : '';
      const buttons = items.map(item =>
        `<button type="button" data-page="${escape(item.id)}">${icon(item.icon, 'nav-svg')}<span class="nav-title">${escape(item.title)}</span>${item.badge ? `<span class="nav-badge">${escape(item.badge)}</span>` : ''}</button>`
      ).join('');
      return `<div class="nav-group">${label}${buttons}</div>`;
    }).join('');
  }

  function boot(config) {
    model = clone(config);
    document.body.className = `${model.app.density || 'compact'} shell-${model.app.shell || 'sidebar'}`;
    const userLabel = model.app.user || '当前用户';
    const userRole = model.app.userRole || '工作空间成员';
    q('#ucd-app').innerHTML = `
      <a class="skip" href="#ucd-main">跳转到主要内容</a>
      <div class="project-app">
        <aside class="project-sidebar">
          <div class="project-brand"><span class="brand-mark">${icon(model.app.brandIcon || 'brand')}</span><strong>${escape(model.app.title)}</strong></div>
          ${model.app.workspace ? `<p class="workspace-label">${escape(model.app.workspace)}</p>` : ''}
          <nav aria-label="主导航">${buildNavHtml()}</nav>
          <div class="sidebar-user"><span class="user-avatar">${escape(userLabel.slice(0, 1))}</span><div><strong>${escape(userLabel)}</strong><small>${escape(userRole)}</small></div></div>
        </aside>
        <div class="project-workspace">
          <header class="project-topbar">
            <span class="topbar-breadcrumb">${escape(model.app.title)}${icon('chevron-right', 'breadcrumb-sep')}<strong id="ucd-breadcrumb"></strong></span>
            <span class="local-indicator"><i></i>本地演示</span>
          </header>
          <main id="ucd-main" tabindex="-1">
            <div class="page-heading">
              <div>
                <p class="eyebrow" id="ucd-page-eyebrow" hidden></p>
                <h1 id="ucd-page-title"></h1>
                <p id="ucd-page-description"></p>
              </div>
            </div>
            <div id="ucd-content"></div>
            <footer class="page-footnote">示例数据仅在当前页面会话中保留</footer>
          </main>
        </div>
      </div>`;
    qa('[data-page]').forEach(button => button.addEventListener('click', () => navigate(button.dataset.page)));
    q('[data-overlay-close]').addEventListener('click', closeOverlay);
    q('#ucd-overlay').addEventListener('close', () => {
      if (!q('#ucd-overlay').open) {
        dispose(q('#ucd-overlay-body'));
        if (overlayReturn?.isConnected) overlayReturn.focus();
      }
    });
    const confirmEl = q('#ucd-confirm');
    if (confirmEl) {
      q('[data-confirm-ok]', confirmEl)?.addEventListener('click', () => finishConfirm(true));
      q('[data-confirm-cancel]', confirmEl)?.addEventListener('click', () => finishConfirm(false));
      confirmEl.addEventListener('cancel', event => { event.preventDefault(); finishConfirm(false); });
    }
    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(2);
      if (id in model.pages && id !== currentPage) navigate(id);
    });
    navigate(model.pages[location.hash.slice(2)] ? location.hash.slice(2) : model.app.startPage || Object.keys(model.pages)[0]);
  }

  return {
    register(name, definition) {
      if (definitions.has(name)) throw new Error(`组件重复注册：${name}`);
      if (typeof definition.render !== 'function') throw new Error(`组件缺少 render：${name}`);
      definitions.set(name, definition);
      if (definition.css) {
        const style = document.createElement('style');
        style.textContent = definition.css;
        document.head.append(style);
      }
    },
    boot, navigate, notify, icon, enhanceSelects, confirm: confirmDialog
  };
})();

UCD.register('stats', {
  render(props, ctx) {
    const h = ctx.escape;
    return `<div class="stats-grid">${(props.items || []).map((item, idx) => {
      const value = item.data ? ctx.data(item.data).filter(row => !item.field || row[item.field] === item.equals).length : item.value;
      const marker = item.icon ? `<span class="stat-icon-box">${ctx.icon(item.icon)}</span>` : '<span class="stat-dot"></span>';
      const change = item.change ? `<span class="stat-change ${h(item.trend || '')}">${h(item.change)}</span>` : '';
      const clickable = item.action ? ` clickable" data-stat-action="${idx}" tabindex="0" role="button` : '';
      return `<article class="stat-card ${h(item.tone || '')}${clickable}"><div class="stat-head"><span class="stat-label">${h(item.label)}</span>${marker}</div><strong>${h(value)}</strong><div class="stat-foot">${change}${item.hint ? `<span>${h(item.hint)}</span>` : ''}</div></article>`;
    }).join('')}</div>`;
  },
  mount(root, props, ctx) {
    root.querySelectorAll('[data-stat-action]').forEach(card => {
      const run = () => {
        const item = (props.items || [])[Number(card.dataset.statAction)];
        if (item?.action) ctx.action(item.action);
      };
      card.addEventListener('click', run);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(); } });
    });
  }
});

UCD.register('field', {
  render(props, ctx) {
    const field = props.field, h = ctx.escape, key = field.key;
    const id = `${ctx.id}-${key}`, value = props.value ?? field.default ?? '';
    const type = field.type || 'text', required = field.required ? ' required' : '';
    const disabled = field.disabled || (field.readonly && ['select', 'checkbox', 'switch', 'radio', 'tags'].includes(type));
    const attrs = `id="${h(id)}" name="${h(key)}" data-field-key="${h(key)}"${required}${field.readonly ? ' readonly' : ''}${disabled ? ' disabled' : ''}`;
    const opts = (field.options || []).map(o => typeof o === 'object' ? o : {value: o, label: o});
    let input;
    if (type === 'select') {
      const options = [...(props.filter ? [{value: '', label: field.allLabel || '全部'}] : []), ...opts];
      input = `<span class="select-wrap"><select ${attrs}>${options.map(o => `<option value="${h(o.value)}"${String(o.value) === String(value) ? ' selected' : ''}>${h(o.label)}</option>`).join('')}</select>${ctx.icon('chevron-down', 'select-chevron')}</span>`;
    } else if (type === 'textarea') {
      input = `<textarea ${attrs} rows="${Number(field.rows) || 4}" placeholder="${h(field.placeholder || `请输入${field.label}`)}">${h(value)}</textarea>`;
    } else if (type === 'checkbox') {
      input = `<input type="checkbox" ${attrs}${value ? ' checked' : ''}>`;
    } else if (type === 'switch') {
      input = `<input type="checkbox" role="switch" ${attrs}${value ? ' checked' : ''}>`;
    } else if (type === 'radio') {
      input = `<div class="radio-group" data-field-group="${h(key)}">${opts.map((o, idx) => `<label class="radio-pill"><input type="radio" name="${h(key)}" value="${h(o.value)}"${String(o.value) === String(value) ? ' checked' : ''}${disabled ? ' disabled' : ''}${idx === 0 && field.required ? ' required' : ''}><span>${h(o.label)}</span></label>`).join('')}</div>`;
      return `<div class="field"><span>${h(field.label)}${field.required ? '<b class="required" aria-hidden="true">*</b>' : ''}</span>${input}${field.help ? `<small>${h(field.help)}</small>` : ''}</div>`;
    } else if (type === 'tags') {
      const selected = new Set(Array.isArray(value) ? value.map(String) : value ? String(value).split(',').map(s => s.trim()) : []);
      input = `<div class="tags-group" data-field-tags="${h(key)}">${opts.map(o => `<label class="tag-chip"><input type="checkbox" name="${h(key)}" value="${h(o.value)}"${selected.has(String(o.value)) ? ' checked' : ''}${disabled ? ' disabled' : ''}><span>${h(o.label)}</span></label>`).join('')}</div>`;
      return `<div class="field"><span>${h(field.label)}${field.required ? '<b class="required" aria-hidden="true">*</b>' : ''}</span>${input}${field.help ? `<small>${h(field.help)}</small>` : ''}</div>`;
    } else if (type === 'search') {
      const ph = field.placeholder || `搜索${field.label}`;
      input = `<span class="input-wrap">${ctx.icon('search', 'input-icon')}<input type="search" ${attrs} value="${h(value)}" placeholder="${h(ph)}"></span>`;
    } else {
      const safeType = ['text', 'email', 'date', 'number', 'tel', 'url'].includes(type) ? type : 'text';
      const ph = field.placeholder || (safeType === 'date' ? '' : `请输入${field.label}`);
      input = `<input type="${h(safeType)}" ${attrs} value="${h(value)}"${ph ? ` placeholder="${h(ph)}"` : ''}${field.min != null ? ` min="${h(field.min)}"` : ''}${field.max != null ? ` max="${h(field.max)}"` : ''}${field.step != null ? ` step="${h(field.step)}"` : ''}>`;
    }
    const cls = type === 'checkbox' ? 'field field-checkbox' : type === 'switch' ? 'field field-switch' : 'field';
    return `<label class="${cls}" for="${h(id)}"><span>${h(field.label)}${field.required ? '<b class="required" aria-hidden="true">*</b>' : ''}</span>${input}${field.help ? `<small>${h(field.help)}</small>` : ''}</label>`;
  }
});

UCD.register('form', {
  render(props, ctx) {
    const record = props.record || ctx.row || {}, h = ctx.escape;
    const cols = Math.max(1, Math.min(3, Number(props.columns) || 2));
    const renderFields = list => `<div class="form-grid cols-${cols}">${(list || []).filter(f => !f.hidden).map(field => {
      const wide = field.wide || field.type === 'textarea' || field.type === 'tags';
      return `<div class="${wide ? 'field-wide' : ''}">${ctx.child('field', {field, value: record[field.key]})}</div>`;
    }).join('')}</div>`;
    const body = Array.isArray(props.sections) && props.sections.length
      ? props.sections.map(sec => `<div class="form-section">${sec.title ? `<div class="form-section-head"><h3>${h(sec.title)}</h3>${sec.description ? `<p>${h(sec.description)}</p>` : ''}</div>` : ''}${renderFields(sec.fields)}</div>`).join('')
      : renderFields(props.fields || []);
    const inner = `<form class="data-form">${props.title && !props.panel ? `<h2>${h(props.title)}</h2>` : ''}${body}<p class="form-feedback" role="status"></p><div class="form-actions"><button type="reset" class="btn">重置</button><button type="submit" class="btn btn-primary">${h(props.submitLabel || '提交')}</button></div></form>`;
    const wrapped = props.panel ? `<section class="panel">${props.title ? `<header class="panel-head"><div><h2>${h(props.title)}</h2>${props.description ? `<p>${h(props.description)}</p>` : ''}</div></header>` : ''}<div class="panel-body">${inner}</div></section>` : inner;
    return `${ctx.slot('before')}${wrapped}${ctx.slot('after')}`;
  },
  mount(root, props, ctx) {
    const form = root.querySelector('form');
    if (!form) return;
    const allFields = Array.isArray(props.sections) && props.sections.length
      ? props.sections.flatMap(sec => sec.fields || [])
      : (props.fields || []);
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const values = {};
      for (const field of allFields) {
        if (field.disabled || field.hidden) continue;
        if (field.type === 'tags') {
          values[field.key] = [...form.querySelectorAll(`[data-field-tags="${CSS.escape(field.key)}"] input:checked`)].map(el => el.value);
          continue;
        }
        if (field.type === 'radio') {
          const checked = form.querySelector(`[data-field-group="${CSS.escape(field.key)}"] input:checked`);
          values[field.key] = checked ? checked.value : '';
          continue;
        }
        const input = form.elements.namedItem(field.key);
        if (!input) continue;
        const option = field.type === 'select' && field.options?.find(item => typeof item === 'object' && String(item.value) === input.value);
        values[field.key] = option ? option.value
          : (field.type === 'checkbox' || field.type === 'switch') ? input.checked
          : field.type === 'number' && input.value !== '' ? Number(input.value)
          : input.value;
      }
      if (ctx.onSubmit) {
        ctx.onSubmit(values);
      } else if (props.data) {
        const key = props.rowKey || 'id';
        const record = props.record || ctx.row;
        const rows = ctx.data(props.data);
        ctx.setData(props.data, record
          ? rows.map(row => row[key] === record[key] ? {...row, ...values} : row)
          : [{...values, [key]: globalThis.crypto?.randomUUID?.() || `record-${Date.now()}`}, ...rows]);
        ctx.notify('已保存');
      } else {
        root.querySelector('.form-feedback').textContent = '配置已更新（本地演示未提交服务器）';
        ctx.notify(props.successMessage || '已保存本地配置');
      }
    });
  }
});

UCD.register('detail', {
  render(props, ctx) {
    const record = props.record || ctx.row || {}, h = ctx.escape;
    const fields = props.fields || Object.keys(record).map(key => ({key, label: key}));
    const grid = `<dl class="detail-grid">${fields.filter(f => !f.hidden).map(field => `<div class="${field.wide || field.type === 'textarea' ? 'wide' : ''}"><dt>${h(field.label)}</dt><dd>${ctx.value(field, record[field.key])}</dd></div>`).join('')}</dl>`;
    const body = props.panel ? `<section class="panel">${props.title ? `<header class="panel-head"><div><h2>${h(props.title)}</h2>${props.description ? `<p>${h(props.description)}</p>` : ''}</div></header>` : ''}<div class="panel-body">${grid}</div></section>` : `${props.title ? `<h2 style="margin-bottom:14px">${h(props.title)}</h2>` : ''}${grid}`;
    return `${ctx.slot('before')}${body}${ctx.slot('after')}`;
  }
});

UCD.register('table', {
  render(props, ctx) {
    const h = ctx.escape, state = ctx.state, fields = props.fields || [], rowKey = props.rowKey || 'id';
    state.filters ||= {}; state.selected ||= []; state.page ||= 0;
    const all = ctx.data(props.data), byKey = Object.fromEntries(fields.map(field => [field.key, field]));
    const columns = props.columns || fields.filter(field => !field.hidden && field.type !== 'textarea').map(field => field.key);
    const rows = all.filter(row => Object.entries(state.filters).every(([key, value]) => {
      if (value === '' || value == null) return true;
      const f = byKey[key];
      if (f?.type === 'select' || f?.type === 'radio' || !props.filters?.includes(key)) {
        return String(row[key] ?? '') === String(value);
      }
      return String(row[key] ?? '').toLocaleLowerCase().includes(String(value).toLocaleLowerCase());
    }));
    if (state.sort) rows.sort((a, b) => String(a[state.sort] ?? '').localeCompare(String(b[state.sort] ?? ''), 'zh-CN', {numeric: true}) * (state.direction || 1));
    const size = props.pageSize || 8, pages = Math.max(1, Math.ceil(rows.length / size));
    state.page = Math.min(state.page, pages - 1);
    state.selected = state.selected.filter(id => all.some(row => String(row[rowKey]) === id));
    const shown = rows.slice(state.page * size, (state.page + 1) * size);
    state.shown = shown;
    const batch = props.batchActions || [], actions = props.actions ?? ['create'], rowActions = props.rowActions ?? ['detail', 'edit', 'delete'];
    const hasFilter = Object.values(state.filters).some(v => v !== '' && v != null);
    const button = (value, index, attr, extra = '') => {
      const action = ctx.normalizeAction(value);
      if (attr === 'data-row-action') {
        const cls = action.type === 'delete' || action.danger ? 'btn-link danger' : 'btn-link';
        return `<button type="button" class="${cls}" ${attr}="${index}" ${extra}>${h(action.label)}</button>`;
      }
      const cls = `btn${action.primary ? ' btn-primary' : ''}${action.danger ? ' btn-danger' : ''}`;
      const lead = action.type === 'create' ? ctx.icon('plus') : '';
      return `<button type="button" class="${cls}" ${attr}="${index}" ${extra}>${lead}${h(action.label)}</button>`;
    };
    const colAlign = key => {
      const f = byKey[key];
      if (f?.align === 'right' || f?.type === 'number') return ' align-right';
      if (f?.align === 'center') return ' align-center';
      return '';
    };
    const colStyle = key => byKey[key]?.width ? ` style="width:${h(byKey[key].width)}"` : '';
    return `${ctx.slot('before')}<section class="panel table-panel"><header class="panel-head"><div><h2>${h(props.title || '记录列表')}</h2>${props.description ? `<p>${h(props.description)}</p>` : ''}</div><div class="toolbar-actions">${ctx.slot('toolbar')}${actions.map((a, i) => button(a, i, 'data-table-action')).join('')}</div></header>
      ${(props.filters || []).length ? `<div class="filter-bar">${props.filters.map(key => ctx.child('field', {field: {...byKey[key], required: false, default: '', type: byKey[key].type === 'select' ? 'select' : 'search'}, value: state.filters[key] || '', filter: true})).join('')}<button type="button" class="btn" data-reset${hasFilter ? '' : ' disabled'}>重置</button></div>` : ''}
      ${batch.length && state.selected.length ? `<div class="selection-bar"><span>已选择 <strong>${state.selected.length}</strong> 项</span>${batch.map((a, i) => button(a, i, 'data-batch-action')).join('')}<button type="button" class="btn-ghost selection-clear" data-clear-selection>取消选择</button></div>` : ''}
      <div class="table-scroll"><table class="data-table"><caption class="visually-hidden">${h(props.title || '记录列表')}</caption><thead><tr>${batch.length ? `<th class="selection-cell"><input type="checkbox" data-select-all aria-label="选择本页全部记录"${shown.length && shown.every(row => state.selected.includes(String(row[rowKey]))) ? ' checked' : ''}></th>` : ''}${columns.map(key => {
        const sortIcon = state.sort === key ? (state.direction === -1 ? 'sort-desc' : 'sort-asc') : 'sort';
        return `<th scope="col" class="${colAlign(key).trim()}"${colStyle(key)}${state.sort === key ? ` aria-sort="${state.direction === -1 ? 'descending' : 'ascending'}"` : ''}><button type="button" class="sort-button" data-sort="${h(key)}">${h(byKey[key]?.label || key)}${ctx.icon(sortIcon)}</button></th>`;
      }).join('')}${rowActions.length ? '<th scope="col" class="row-actions">操作</th>' : ''}</tr></thead><tbody>${shown.map((row, index) => {
        const isSel = state.selected.includes(String(row[rowKey]));
        return `<tr data-row="${index}" tabindex="0" class="${isSel ? 'is-selected' : ''}" aria-label="${h(row[props.titleField || columns[0]] || '记录')}">${batch.length ? `<td class="selection-cell"><input type="checkbox" data-select="${index}" aria-label="选择${h(row[columns[0]])}"${isSel ? ' checked' : ''}></td>` : ''}${columns.map((key, ci) => `<td class="${ci === 0 ? 'primary-col' : ''}${colAlign(key)}">${ctx.node.slots?.[`cell:${key}`] ? ctx.slot(`cell:${key}`, {row, valueData: row[key], field: byKey[key]}) : ctx.value(byKey[key] || {}, row[key])}</td>`).join('')}${rowActions.length ? `<td class="row-actions">${rowActions.map((a, i) => {
          const act = ctx.normalizeAction(a);
          return !act.when || row[act.when.field] === act.when.equals ? button(a, i, 'data-row-action', `data-index="${index}"`) : '';
        }).join('')}</td>` : ''}</tr>`;
      }).join('')}</tbody></table>${!shown.length ? '<div class="empty-state"><strong>暂无匹配记录</strong><p>尝试调整筛选条件，或新建一条记录。</p></div>' : ''}</div>
      <footer class="table-footer"><span role="status">共 ${rows.length} 条记录${rows.length ? ` · 第 ${state.page * size + 1}–${Math.min((state.page + 1) * size, rows.length)} 条` : ''}</span><div class="pagination"><button type="button" class="btn btn-small" data-prev${state.page === 0 ? ' disabled' : ''}>上一页</button><span class="pagination-info">${state.page + 1} / ${pages}</span><button type="button" class="btn btn-small" data-next${state.page >= pages - 1 ? ' disabled' : ''}>下一页</button></div></footer></section>${ctx.slot('after')}`;
  },
  mount(root, props, ctx) {
    const state = ctx.state, rowKey = props.rowKey || 'id', shown = state.shown;
    const refresh = () => {
      const active = document.activeElement, key = active?.dataset?.fieldKey, start = active?.selectionStart, end = active?.selectionEnd;
      ctx.refresh();
      if (key) {
        const input = [...root.querySelectorAll('[data-field-key]')].find(el => el.dataset.fieldKey === key);
        input?.focus();
        if (start != null && input?.type === 'search') input.setSelectionRange(start, end);
      }
    };
    root.querySelectorAll('.filter-bar [data-field-key]').forEach(input => input.addEventListener(input.tagName === 'SELECT' ? 'change' : 'input', () => {
      state.filters[input.dataset.fieldKey] = input.value;
      state.page = 0;
      refresh();
    }));
    root.querySelector('[data-reset]')?.addEventListener('click', () => { state.filters = {}; state.page = 0; ctx.refresh(); });
    root.querySelector('[data-clear-selection]')?.addEventListener('click', () => { state.selected = []; ctx.refresh(); });
    root.querySelectorAll('[data-sort]').forEach(button => button.addEventListener('click', () => {
      state.direction = state.sort === button.dataset.sort ? -state.direction : 1;
      state.sort = button.dataset.sort;
      ctx.refresh();
    }));
    root.querySelector('[data-prev]')?.addEventListener('click', () => { state.page--; ctx.refresh(); });
    root.querySelector('[data-next]')?.addEventListener('click', () => { state.page++; ctx.refresh(); });
    root.querySelectorAll('[data-select]').forEach(input => input.addEventListener('change', () => {
      const key = String(shown[Number(input.dataset.select)][rowKey]);
      state.selected = input.checked ? [...new Set([...state.selected, key])] : state.selected.filter(id => id !== key);
      ctx.refresh();
    }));
    root.querySelector('[data-select-all]')?.addEventListener('change', event => {
      const keys = shown.map(row => String(row[rowKey]));
      state.selected = event.target.checked ? [...new Set([...state.selected, ...keys])] : state.selected.filter(id => !keys.includes(id));
      ctx.refresh();
    });
    root.querySelectorAll('[data-table-action]').forEach(button => button.addEventListener('click', () => ctx.action((props.actions ?? ['create'])[Number(button.dataset.tableAction)])));
    root.querySelectorAll('[data-row-action]').forEach(button => button.addEventListener('click', () => ctx.action((props.rowActions ?? ['detail', 'edit', 'delete'])[Number(button.dataset.rowAction)], {row: shown[Number(button.dataset.index)]})));
    root.querySelectorAll('[data-batch-action]').forEach(button => button.addEventListener('click', () => ctx.action(props.batchActions[Number(button.dataset.batchAction)], {rows: ctx.data(props.data).filter(row => state.selected.includes(String(row[rowKey])))})));
    root.querySelectorAll('[data-row]').forEach(row => {
      const open = () => ctx.action('detail', {row: shown[Number(row.dataset.row)]});
      row.addEventListener('click', event => { if (!event.target.closest('button,input,a,select,textarea')) open(); });
      row.addEventListener('keydown', event => { if (event.key === 'Enter' && event.target === row) { event.preventDefault(); open(); } });
    });
  }
});

UCD.register('steps', {
  render(props, ctx) {
    const h = ctx.escape, current = Number(props.current) || 0;
    const items = (props.items || []).map(item => typeof item === 'object' ? item : {title: item});
    const list = `<ol class="steps">${items.map((item, idx) => {
      const done = idx < current, active = idx === current;
      const badge = done ? ctx.icon('check') : String(idx + 1);
      return `<li class="${done ? 'done' : ''}"${active ? ' aria-current="step"' : ''}><span class="step-number">${badge}</span><div><span>${h(item.title)}</span>${item.description ? `<span class="step-meta">${h(item.description)}</span>` : ''}</div></li>`;
    }).join('')}</ol>`;
    return props.panel === false ? list : `<section class="panel">${props.title ? `<header class="panel-head"><div><h2>${h(props.title)}</h2>${props.description ? `<p>${h(props.description)}</p>` : ''}</div></header>` : ''}<div class="panel-body">${list}</div></section>`;
  }
});

UCD.register('alert', {
  render(props, ctx) {
    const tone = props.tone || 'neutral';
    const iconName = tone === 'success' ? 'check-circle' : (tone === 'warning' || tone === 'danger') ? 'alert' : 'info';
    return `<div class="alert ${ctx.escape(tone)}" role="note">${ctx.icon(iconName, 'alert-icon')}<div class="alert-copy">${props.title ? `<strong>${ctx.escape(props.title)}</strong>` : ''}<p>${ctx.escape(props.text || '')}</p></div></div>`;
  }
});

UCD.register('split', {
  render(props, ctx) {
    const slots = ctx.node.slots || {};
    const names = Object.keys(slots);
    let template = '';
    if (typeof props.columns === 'string' && /^[0-9a-zA-Z.%(),\s-]+$/.test(props.columns)) {
      template = props.columns;
    } else if (Array.isArray(props.columns) && props.columns.length) {
      template = props.columns.map(col => typeof col === 'number' ? `minmax(0, ${col}fr)` : /^[0-9]+(px|%|fr|rem)$/.test(String(col)) ? String(col) : 'minmax(0, 1fr)').join(' ');
    } else {
      template = `repeat(${Math.max(1, names.length)}, minmax(0, 1fr))`;
    }
    return `<div class="split-grid" style="grid-template-columns:${ctx.escape(template)}">${names.map(name => `<div class="split-pane">${ctx.slot(name)}</div>`).join('')}</div>`;
  }
});

UCD.register('line-chart', {
  render(props, ctx) {
    const h = ctx.escape, values = (props.values || []).map(Number), labels = props.labels || [];
    const w = 520, ht = 160, padX = 12, padY = 14;
    const max = Math.max(1, ...values), min = Math.min(0, ...values), span = Math.max(1, max - min);
    const step = values.length > 1 ? (w - padX * 2) / (values.length - 1) : 0;
    const pts = values.map((v, i) => [+(padX + i * step).toFixed(1), +(ht - padY - ((v - min) / span) * (ht - padY * 2)).toFixed(1)]);
    const line = pts.map(p => p.join(',')).join(' ');
    const area = pts.length ? `${padX},${ht - padY} ${line} ${pts[pts.length - 1][0]},${ht - padY}` : '';
    const gid = `grad-${ctx.id.replace(/[^a-zA-Z0-9-]/g, '-')}`;
    const grid = [0.25, 0.5, 0.75, 1].map(r => `<line x1="${padX}" y1="${(ht - padY - r * (ht - padY * 2)).toFixed(1)}" x2="${w - padX}" y2="${(ht - padY - r * (ht - padY * 2)).toFixed(1)}" stroke="var(--border)" stroke-dasharray="3 3"/>`).join('');
    const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2"><title>${h(labels[i] ?? '')}: ${h(values[i])}</title></circle>`).join('');
    const summary = props.summary || props.change ? `<div class="chart-summary">${props.summary ? `<strong>${h(props.summary)}</strong>` : ''}${props.change ? `<span class="stat-change ${h(props.trend || '')}">${h(props.change)}</span>` : ''}</div>` : '';
    return `<section class="panel">${props.title ? `<header class="panel-head"><div><h2>${h(props.title)}</h2>${props.description ? `<p>${h(props.description)}</p>` : ''}</div></header>` : ''}<div class="panel-body">${summary}<svg class="line-chart-svg" viewBox="0 0 ${w} ${ht}" role="img" aria-label="${h(props.title || '趋势图')}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--primary)" stop-opacity="0.22"/><stop offset="100%" stop-color="var(--primary)" stop-opacity="0.01"/></linearGradient></defs>${grid}${area ? `<polygon points="${area}" fill="url(#${gid})"/>` : ''}${line ? `<polyline fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>` : ''}${dots}</svg>${labels.length ? `<div class="chart-labels">${labels.map(l => `<span>${h(l)}</span>`).join('')}</div>` : ''}</div></section>`;
  }
});

UCD.register('bar-chart', {
  render(props, ctx) {
    const h = ctx.escape;
    let items = props.items || [];
    if (!items.length && props.data && props.groupBy) {
      const counts = new Map();
      for (const row of ctx.data(props.data)) {
        const key = String(row[props.groupBy] ?? '未分类');
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      items = [...counts.entries()].map(([label, value]) => ({label, value}));
    }
    const max = Math.max(1, ...items.map(i => Number(i.value) || 0));
    const unit = props.unit || '';
    const rows = items.map(item => {
      const val = Number(item.value) || 0;
      const pct = Math.max(2, Math.min(100, Math.round(val / max * 100)));
      return `<div class="chart-row"><span>${h(item.label)}</span><div class="bar-track"><span class="bar-fill ${h(item.tone || '')}" style="width:${pct}%"></span></div><span class="chart-value">${h(item.display ?? `${val}${unit}`)}</span></div>`;
    }).join('');
    return `<section class="panel">${props.title ? `<header class="panel-head"><div><h2>${h(props.title)}</h2>${props.description ? `<p>${h(props.description)}</p>` : ''}</div></header>` : ''}<div class="panel-body">${rows || '<p class="muted">暂无数据</p>'}</div></section>`;
  }
});

UCD.register('tabs', {
  render(props, ctx) {
    const items = props.items || [];
    if (!items.some(item => item.key === ctx.state.active)) ctx.state.active = items[0]?.key;
    const prefix = ctx.id.replace(/[^a-zA-Z0-9-]/g, '-');
    return `<section class="tabs-shell"><div class="tab-list" role="tablist">${items.map((item, i) => `<button type="button" role="tab" id="${prefix}-tab-${i}" aria-controls="${prefix}-panel-${i}" aria-selected="${item.key === ctx.state.active}" tabindex="${item.key === ctx.state.active ? 0 : -1}" data-tab="${ctx.escape(item.key)}">${ctx.escape(item.label)}</button>`).join('')}</div>${items.map((item, i) => `<div class="tab-panel" role="tabpanel" id="${prefix}-panel-${i}" aria-labelledby="${prefix}-tab-${i}"${item.key === ctx.state.active ? '' : ' hidden'}>${ctx.slot(item.key)}</div>`).join('')}</section>`;
  },
  mount(root, props, ctx) {
    const tabs = [...root.querySelectorAll('[data-tab]')];
    const select = (key, focus) => {
      ctx.state.active = key;
      ctx.refresh();
      if (focus) [...root.querySelectorAll('[data-tab]')].find(tab => tab.dataset.tab === key)?.focus();
    };
    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => select(tab.dataset.tab, false));
      tab.addEventListener('keydown', event => {
        const index = {ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i + tabs.length - 1) % tabs.length, Home: 0, End: tabs.length - 1}[event.key];
        if (index != null) { event.preventDefault(); select(tabs[index].dataset.tab, true); }
      });
    });
  }
});

UCD.register('timeline', {
  render(props, ctx) {
    const h = ctx.escape;
    const items = props.items || (props.data ? ctx.data(props.data).map(row => ({
      title: row[props.titleField || 'title'],
      time: row[props.timeField || 'time'],
      description: row[props.descField || 'description'],
      tone: row[props.toneField || 'tone']
    })) : []);
    const list = `<ul class="timeline">${items.map(item => `<li class="${h(item.tone || '')}"><div class="timeline-head"><span class="timeline-title">${h(item.title || '')}</span>${item.time ? `<small>${h(item.time)}</small>` : ''}</div>${item.description ? `<p class="timeline-desc">${h(item.description)}</p>` : ''}</li>`).join('')}</ul>`;
    return props.panel === false ? list : `<section class="panel">${props.title ? `<header class="panel-head"><div><h2>${h(props.title)}</h2>${props.description ? `<p>${h(props.description)}</p>` : ''}</div></header>` : ''}<div class="panel-body">${list || '<p class="muted">暂无动态</p>'}</div></section>`;
  }
