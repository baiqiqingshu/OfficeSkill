* { box-sizing: border-box; }

.required { color: var(--danger); }
.field-checkbox { flex-direction: row; align-items: center; padding-top: 25px; }

.data-table tbody tr { cursor: pointer; }

.page-footnote { margin-top: 24px; color: var(--muted); font-size: 11px; }

.comfortable .data-table td, .comfortable .data-table th { padding-block: 19px; }

.shell-topnav .project-app { display: block; }

.shell-topnav .project-sidebar nav { display: flex; flex-wrap: wrap; }
.shell-topnav .workspace-label, .shell-topnav .sidebar-user, .shell-topnav .nav-icon { display: none; }

UCD.register('form', {

      event.preventDefault();

        const record = props.record || ctx.row;
        const rows = ctx.data(props.data);
        ctx.setData(props.data, record ? rows.map(row=>row[key] === record[key] ? {...row,...values} : row) : [{...values,[key]:globalThis.crypto?.randomUUID?.() || `record-${Date.now()}`},...rows]);

    });
  }
});
