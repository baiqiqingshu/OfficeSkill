<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录活动图 · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>用户登录活动图</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="login-activity-title login-activity-desc">
        <title id="login-activity-title">用户登录活动图</title>
        <desc id="login-activity-desc">泳道活动图：用户提交凭据后经前端校验、后端查库验证并签发会话令牌，最终跳转首页；校验失败路径回退至重新输入。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lane dividers -->
        <line x1="40" y1="72" x2="920" y2="72" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="40" y1="172" x2="920" y2="172" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="272" x2="920" y2="272" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="372" x2="920" y2="372" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- Actor column divider -->
        <line x1="152" y1="72" x2="152" y2="472" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- Lane labels (eyebrow slot, CJK register: 12px sans 500) -->
        <text x="96" y="126" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户</text>
        <text x="96" y="226" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">前端</text>
        <text x="96" y="326" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">后端</text>
        <text x="96" y="426" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">数据库</text>

        <!-- Arrows (drawn first) -->
        <!-- A1: start dot → 填写凭据 -->
        <line x1="176" y1="122" x2="194" y2="122" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A2: 填写凭据 → 校验输入 (SUBMIT) -->
        <path d="M 240,146 V 174 Q 240,182 248,182 H 432 Q 440,182 440,190 V 197" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A3: 校验输入 → 填写凭据 (INVALID retry loop, dashed) -->
        <path d="M 380,246 V 250 Q 380,258 372,258 H 228 Q 220,258 220,250 V 147" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- A4: 校验输入 → 验证凭据 (POST /LOGIN, link blue) -->
        <path d="M 504,222 H 512 Q 520,222 520,230 V 314 Q 520,322 528,322 H 535" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- A5: 验证凭据 → 用户记录 (SELECT, down) -->
        <line x1="580" y1="346" x2="580" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A6: 用户记录 → 验证凭据 (RECORD, dashed return, up) -->
        <line x1="620" y1="398" x2="620" y2="348" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- A7: 验证凭据 → 判断菱形 -->
        <line x1="664" y1="322" x2="686" y2="322" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A8: 菱形 → 签发令牌 (VALID) -->
        <line x1="784" y1="322" x2="818" y2="322" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- A9: 菱形 → 填写凭据 (401 RETRY, dashed, top channel) -->
        <path d="M 736,290 V 64 Q 736,56 728,56 H 268 Q 260,56 260,64 V 96" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- A10: 签发令牌 → 跳转首页 (200 · TOKEN, accent handoff, up) -->
        <line x1="870" y1="298" x2="870" y2="248" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- A11: 跳转首页 → 已登录 (up) -->
        <line x1="856" y1="198" x2="856" y2="130" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="318" y="164" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="340" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>

        <rect x="228" y="196" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="250" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INVALID</text>

        <rect x="528" y="266" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="275" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /LOGIN</text>

        <rect x="532" y="366" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="552" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SELECT</text>

        <rect x="628" y="366" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="648" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RECORD</text>

        <rect x="784" y="304" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="802" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VALID</text>

        <rect x="744" y="134" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="776" y="143" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">401 RETRY</text>

        <rect x="796" y="266" width="66" height="12" rx="2" fill="#f5f5f5"/>
        <text x="829" y="275" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 · TOKEN</text>

        <!-- Steps -->
        <!-- Start -->
        <circle cx="170" cy="122" r="5" fill="#2d3142"/>

        <!-- 用户: 填写凭据 (input treatment) -->
        <rect x="196" y="98" width="128" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="260" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">填写凭据</text>
        <text x="260" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">user · password</text>

        <!-- 前端: 校验输入 -->
        <rect x="376" y="198" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="440" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">校验输入</text>
        <text x="440" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">client-side check</text>

        <!-- 后端: 验证凭据 -->
        <rect x="536" y="298" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">验证凭据</text>
        <text x="600" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">lookup · bcrypt</text>

        <!-- 数据库: 用户记录 (store treatment) -->
        <rect x="536" y="398" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="600" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户记录</text>
        <text x="600" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">users table</text>

        <!-- 后端: 判断菱形 -->
        <polygon points="736,290 784,322 736,354 688,322" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="736" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">有效？</text>

        <!-- 后端: 签发令牌 (focal accent) -->
        <rect x="820" y="298" width="100" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="870" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">签发令牌</text>
        <text x="870" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">JWT · session</text>

        <!-- 前端: 跳转首页 -->
        <rect x="792" y="198" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="856" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">跳转首页</text>
        <text x="856" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">302 · /home</text>

        <!-- End -->
        <circle cx="856" cy="120" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="856" cy="120" r="3" fill="#2d3142"/>
        <text x="872" y="124" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">已登录</text>

        <!-- Legend -->
        <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="524" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="533" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">步骤</text>

        <rect x="130" y="524" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="150" y="533" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">输入</text>

        <rect x="220" y="524" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="240" y="533" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">存储</text>

        <polygon points="318,524 326,529 318,534 310,529" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="334" y="533" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">判断</text>

        <circle cx="400" cy="529" r="5" fill="none" stroke="#2d3142" stroke-width="1"/>
        <circle cx="400" cy="529" r="1.8" fill="#2d3142"/>
        <text x="414" y="533" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">起止</text>

        <line x1="500" y1="529" x2="528" y2="529" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="536" y="533" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">重试回路</text>

        <line x1="660" y1="529" x2="688" y2="529" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="696" y="533" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">关键交接</text>

        <line x1="800" y1="529" x2="828" y2="529" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="836" y="533" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">HTTP</text>
      </svg>
    </div>
  </div>
</body>
</html>
